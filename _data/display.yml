# Controls what sections are displayed on the homepage and footer text configuration.
homepage:
  show_experience: false
  show_news: true
  num_news: 12
  show_selected_publications: true
  show_professional_activities: true
  show_videos: true

# Dark mode configuration
dark_mode:
  enabled: true
  default_theme: "light"  # or "dark"

# Footer credit. The copyright line and current year are rendered by
# _includes/footer.html — data files are not run through Liquid, so template
# tags placed here would be printed literally.
footer_text: >-
# Layout inspired by <a href="https://luost.me/" target="_blank" rel="noopener noreferrer">Shitong Luo</a>.

# Visitor globe at the bottom of the homepage (MapMyVisitors).
# Paste the full script address from your MapMyVisitors embed code between the
# quotes, for example:
#   globe_src: "https://mapmyvisitors.com/globe.js?d=YOUR_TOKEN"
# Leave it empty to hide the widget. (ClustrMaps, used before, went offline.)
visitor_map:
  globe_src: ""
