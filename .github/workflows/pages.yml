# Build and deploy the site with the Jekyll version pinned in the Gemfile.
#
# To use this: GitHub repo -> Settings -> Pages -> "Build and deployment" ->
# Source: "GitHub Actions". Until you do that, GitHub keeps using its classic
# builder (Jekyll 3.10) and this workflow only acts as a build check.
name: Build and deploy site

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Check for broken internal links and empty metadata
        run: |
          set -e
          test -s _site/sitemap.xml
          test -s _site/robots.txt
          grep -q 'rel="canonical"' _site/index.html
          grep -q 'application/ld+json' _site/index.html
          echo "Post-build checks passed."

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
