# ============================================================================
#  Site configuration — longuyenviet.github.io
#  NOTE: this file is NOT reloaded automatically by `jekyll serve`.
#        Restart the server after editing.
# ============================================================================

# ---------------------------------------------------------------------------
# Identity  (used by jekyll-seo-tag for <title>, meta description, JSON-LD)
# ---------------------------------------------------------------------------
title: "Long V. Nguyen"
tagline: "Semantic Communications & AI for Wireless Networks"
description: >-
  Long V. Nguyen (Nguyễn Viết Long) is a PhD student in Computer Engineering at
  Memorial University of Newfoundland, working on semantic communications,
  generative AI, deep reinforcement learning for next-generation intelligent wireless networks.
url: "https://longuyenviet.github.io"
baseurl: ""            # subpath of the site, e.g. /blog
lang: en-CA
timezone: America/St_Johns

# Canonical author record. jekyll-seo-tag turns this into schema.org/Person.
author:
  name: "Long V. Nguyen"
  email: "lnguyen@mun.ca"

# Social profiles -> "sameAs" in structured data. This is how Google links the
# site to Google Scholar / ORCID / GitHub and builds an entity for you.
social:
  name: "Long V. Nguyen"
  links:
    - https://scholar.google.com/citations?user=ErZnjXoAAAAJ
    - https://github.com/longuyenviet
    - https://www.linkedin.com/in/longgviet04
    # - https://orcid.org/0000-0000-0000-0000   # add once you have an ORCID iD

# Default sharing image is applied per page through `defaults` below, because
# jekyll-seo-tag reads `page.image` only — a site-level `image:` is ignored.
logo: /assets/images/etc/favicon.png
# No `twitter:` block on purpose: without a real handle, jekyll-seo-tag emits
# a broken `twitter:site content="@"` tag.

# Search Console / Bing verification — the token only, not the whole meta tag.
# jekyll-seo-tag renders this as <meta name="google-site-verification" ...>.
# Do not remove it: Google re-checks periodically and will unverify the
# property if the tag disappears.
webmaster_verifications:
  google: "mP1BaMkYmoK6CxZleEMxSjny92Us1xg04eVMW7cD4MU"
#   bing: ""

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from
  # jekyll-email-protect only runs when the site is built by GitHub Actions
  # (see .github/workflows/pages.yml). It is ignored by the classic GitHub
  # Pages builder, so templates must not depend on it for correctness.
  - jekyll-email-protect

# Jekyll skips files beginning with an underscore, so _headers has to be
# listed explicitly or it never reaches the built site.
include:
  - _headers

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor/
  - .github/
  - .jekyll-cache/

# ---------------------------------------------------------------------------
# Collections
# ---------------------------------------------------------------------------
collections:
  - publications
  - news
  - gallery
  - notes

# ---------------------------------------------------------------------------
# Front-matter defaults
# ---------------------------------------------------------------------------
defaults:
  # Default Open Graph / Twitter sharing card for every page.
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/etc/og-card.png
        width: 1200
        height: 630
        alt: "Long V. Nguyen, semantic communications and AI for wireless networks"

  # Keep third-party / template leftovers out of the sitemap.
  - scope:
      path: "assets/images/files"
    values:
      sitemap: false
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
