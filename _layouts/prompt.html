<!-- Minimal layout with a narrow container, used for simple pages such as 404. -->

<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}" class="h-100">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    {% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
    <script>
        (function() {
            var stored = null;
            try { stored = localStorage.getItem('theme-preference'); } catch (e) {}
            var theme = stored
                || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    {% seo %}

    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/etc/favicon.png' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/css/bootstrap.min.css" integrity="sha512-P5MgMn1jBN01asBgU0z60Qk4QxiXo86+wlFahKrsQf37c9cro517WzVSPPV1tDKzhku2iJ2FVgL67wG03SGnNA==" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">
    <style>
        .container { width: auto; max-width: 680px; padding: 0 15px; }
    </style>
</head>
<body class="d-flex flex-column h-100 bg-light">
    <main role="main" class="flex-shrink-0">
        <div class="container">
            {{ content }}
        </div>
    </main>
</body>
</html>
