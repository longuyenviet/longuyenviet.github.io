<!-- Base template that includes common HTML structure, navigation, footer, and JS imports. 
All other pages extend this layout. -->

<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Prevent theme flash: runs before first paint, respects OS preference. -->
    <script>
        (function() {
            var stored = null;
            try { stored = localStorage.getItem('theme-preference'); } catch (e) {}
            var theme = stored
                || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <!--
      jekyll-seo-tag emits the page's one canonical title element, the meta
      description, the Open Graph / Twitter tags and the base JSON-LD.
      Do not add a second title element anywhere in this layout.
    -->
    {% seo %}
    {% include structured_data.html %}

    <!-- Icons and theme colour -->
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/etc/favicon.png' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/images/etc/favicon.png' | relative_url }}">
    <meta name="theme-color" content="#0b1b2b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)">

    <!--
      CSS loading strategy.

      Previously all six stylesheets were render-blocking, four of them on
      third-party origins; Lighthouse measured 8.5s LCP on mobile, with 7.8s of
      that pure render delay waiting on CSS.

      Now: the two stylesheets that define layout (Bootstrap, self-hosted so it
      shares the page's own HTTP/2 connection) and the theme load normally,
      because a flash of unstyled layout is worse than a slightly later paint.
      Everything else — icon fonts and KaTeX — is loaded asynchronously with the
      media="print"/onload swap, so it never blocks first paint. Icons appear a
      moment after text, which is the right trade.
    -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <!-- The webfont is same-origin and preloaded so it is in place before the
         first paint; that is what keeps CLS at zero. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="{{ '/assets/vendor/fonts/rubik-latin.woff2' | relative_url }}">

    <!-- Render-blocking on purpose: fonts, layout and theme -->
    <link rel="stylesheet" href="{{ '/assets/css/fonts.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/vendor/bootstrap-4.6.0.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/global.css' | relative_url }}">

    <!-- Non-blocking: maths only. Icons are inline SVG (see _includes/icon.html),
         so no icon font is loaded at all. -->
    <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
          href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
          integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
    <noscript>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    </noscript>
</head>
<body class="bg-light" {{ page.body_attr }}>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% include navbar.html %}
    <main id="main-content" class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        {{content}}
    </main>
    {% include footer.html %}

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.lazy/1.7.9/jquery.lazy.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.0/js/bootstrap.min.js" integrity="sha512-XKa9Hemdy1Ui3KSGgJdgMyYlUg1gM+QhL6cnlyTe2qzMCYm4nAZ1PsVerQzTTXzonUR+dmswHqgJPuwCq1MaAg==" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/github-buttons/2.14.2/buttons.min.js" integrity="sha512-OYwZx04hKFeFNYrWxIyo3atgGpb+cxU0ENWBZs72X7T9U+NoHPM1ftUn/Mfw7dRDXrqWA6M1wBg6z6fGE32aeA==" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
              delimiters: [
                  {left: '$$', right: '$$', display: true},
                  {left: '$', right: '$', display: false}
              ],
              throwOnError : false
            });
        });
    </script>
    <script src="{{ '/assets/js/common.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/bubble_visual_hash.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/semantic_scholar_citation_count.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/dark_mode.js' | relative_url }}"></script>
    <script defer src="{{ '/assets/js/enhancements.js' | relative_url }}"></script>
    <script defer src="{{ '/assets/js/video_carousel.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/background_animation.js' | relative_url }}"></script>
</body>
</html>
