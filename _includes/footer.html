<!-- Site footer. -->

<footer class="footer site-footer">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="site-footer-inner">
            <div class="site-footer-meta">
                <span>Last updated <time datetime="{{ site.time | date_to_xmlschema }}">{{ site.time | date: "%b %Y" }}</time></span>
            </div>
            <div class="site-footer-credit">
                &copy; {{ site.time | date: "%Y" }} {{ site.author.name }}. {{ site.data.display.footer_text }}
            </div>
        </div>
    </div>
</footer>
