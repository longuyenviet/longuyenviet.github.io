<!-- Primary navigation. Items come from _data/navigation.yml. -->

<nav class="navbar navbar-expand-sm navbar-light fixed-top site-nav" aria-label="Primary">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <a class="navbar-brand site-brand" href="{{ '/' | relative_url }}">
            <span class="site-brand-mark" aria-hidden="true"></span>
            <strong>{{ site.data.profile.navbar_name }}</strong><span class="blinking-slash" aria-hidden="true">|</span>
        </a>

        <button class="navbar-toggler site-nav-toggle" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <i class="fas fa-bars" aria-hidden="true"></i> <span>Menu</span>
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto align-items-sm-center">
                {%- for item in site.data.navigation.pages %}
                {%- assign is_active = false -%}
                {%- if item.name == page.navbar_title %}{% assign is_active = true %}{% endif -%}
                <li class="nav-item{% if is_active %} active{% endif %}">
                    <a class="nav-link" href="{{ item.url | relative_url }}"{% if is_active %} aria-current="page"{% endif %}>{{ item.name }}</a>
                </li>
                {%- endfor %}
                <li class="nav-item">
                    <button class="nav-link btn btn-link dark-mode-toggle" id="darkModeToggle" type="button" aria-pressed="false" aria-label="Toggle dark mode">
                        <i class="fas fa-moon dark-mode-icon" aria-hidden="true"></i>
                        <i class="fas fa-sun light-mode-icon" style="display: none;" aria-hidden="true"></i>
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>
