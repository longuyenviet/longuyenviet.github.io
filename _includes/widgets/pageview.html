{%- comment -%}
  Clustrmaps visitor globe.

  This must stay a plain <script> tag written directly in the page, exactly as
  Clustrmaps supplies it. An earlier version injected the script from
  JavaScript to lazy-load it; the globe then never rendered, because the
  Clustrmaps script has to run while the page is being parsed to place itself.
  It sits at the very bottom of the page, so it does not delay the content
  above it.
{%- endcomment -%}
<div class="visitor-globe">
    <div class="visitor-globe-slot">
        <script type="text/javascript" id="clstr_globe" src="https://clustrmaps.com/globe.js?d=j4bX_U1ChVDtaTwglQ__PJvYC2tY2tlrw3RCrtNvJhY"></script>
    </div>
</div>
